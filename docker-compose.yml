services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rootwise
      POSTGRES_USER: ${POSTGRES_USER:-rootwise}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the environment before starting Compose}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:5432:5432"
    volumes:
      - rootwise-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-rootwise} -d rootwise"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  rootwise-postgres-data:
